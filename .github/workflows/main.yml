name: my first workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  first_job:
    name: my first job
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Repository Code
       uses: actions/checkout@v4
     - name: Display repository tree
       run: tree

     - name: Greet the user
       run: |
        echo "Hello '${{github.actor}}'."
        echo "My API key will '${{ secrets.APIKEY }}'."
        echo "My Persekitaran is '${{ vars.PERSEKITARAN }}'."
       shell: bash
